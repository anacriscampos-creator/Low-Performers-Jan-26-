<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayJoy &mdash; L&D Dashboard Q1-Q2 2026</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0E13;font-family:'IBM Plex Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lock-wrap{width:100%;max-width:380px;padding:0 24px}
.lock-logo{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:#F0F4F8;text-align:center;margin-bottom:32px}
.lock-logo span{color:#2ECC71}
.lock-card{background:#0F1A10;border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:32px}
.lock-icon{width:44px;height:44px;background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.25);border-radius:10px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:20px}
.lock-title{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:#F0F4F8;text-align:center;margin-bottom:6px}
.lock-sub{font-size:12px;color:#5A7A60;text-align:center;margin-bottom:28px;line-height:1.5}
.lock-label{font-family:'IBM Plex Mono',monospace;font-size:10px;color:#5A7A60;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:8px;display:block}
.lock-input{width:100%;background:#162018;border:1px solid rgba(255,255,255,0.08);border-radius:6px;padding:10px 14px;color:#F0F4F8;font-size:13px;font-family:'IBM Plex Mono',monospace;outline:none;transition:border-color 0.2s;letter-spacing:2px}
.lock-input:focus{border-color:rgba(46,204,113,0.4)}
.lock-input::placeholder{letter-spacing:0;color:#3A5A40}
.lock-btn{width:100%;margin-top:16px;padding:11px;background:#2ECC71;border:none;border-radius:6px;color:#0A0E13;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:0.5px;cursor:pointer;transition:background 0.15s}
.lock-btn:hover{background:#27AE60}
.lock-error{margin-top:12px;padding:9px 12px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.25);border-radius:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#E74C3C;text-align:center;display:none}
.lock-error.show{display:block}
.shake{animation:shake 0.35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.conf-strip{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#3A5A40;letter-spacing:0.5px}
.conf-dot{width:5px;height:5px;border-radius:50%;background:#2ECC71;opacity:0.5}
</style>
</head>
<body>
<div class="lock-wrap">
  <div class="lock-logo">PayJoy <span>//</span> L&amp;D Dashboard Q1-Q2 2026</div>
  <div class="lock-card">
    <div class="lock-icon">&#128274;</div>
    <div class="lock-title">Restricted access</div>
    <div class="lock-sub">This report is confidential.<br>Enter the password to continue.</div>
    <label class="lock-label" for="pwInput">Password</label>
    <input class="lock-input" id="pwInput" type="password" placeholder="Enter password" autocomplete="off" onkeydown="if(event.key==='Enter')unlock()">
    <button class="lock-btn" onclick="unlock()">Unlock dashboard &#8594;</button>
    <div class="lock-error" id="lockError">Incorrect password. Please try again.</div>
  </div>
  <div class="conf-strip"><span class="conf-dot"></span> CONFIDENTIAL &middot; HR USE ONLY <span class="conf-dot"></span></div>
</div>
<div id="dashboardContent" style="display:none;width:100%"></div>
<script>
const CORRECT="PayJoy2026!";
function unlock(){
  const val=document.getElementById('pwInput').value;
  const err=document.getElementById('lockError');
  if(val===CORRECT){
    document.querySelector('.lock-wrap').style.display='none';
    const dash=document.getElementById('dashboardContent');
    dash.style.display='block';
    dash.innerHTML=atob(DASHBOARD_B64);
    dash.querySelectorAll('script').forEach(old=>{
      const s=document.createElement('script');
      s.textContent=old.textContent;
      old.parentNode.replaceChild(s,old);
    });
  } else {
    err.classList.add('show');
    const card=document.querySelector('.lock-card');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    document.getElementById('pwInput').value='';
    document.getElementById('pwInput').focus();
  }
}
